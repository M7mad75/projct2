<style>
    * {
	margin: 0;
	padding: 0;
}
body{
  background-color:#121212;
}
header{
    background-color:#444444; 
    margin: 10px;
    border-radius: 15px;
   justify-content: center;
   align-items: center;   
   display: flex; 
}
h1{
    color:#E0E0E0;
    margin: 10px;
}
div{

   height: 155px;
   width: 70vw;
   min-width: 600px;
   display: flex;
   align-items: center;
   justify-content: space-around;
   margin: auto;
   top: 10px;
}
.a{
  position: relative;
  text-decoration: none;
  color: #B0B0B0;
  font-size: 18px;
  letter-spacing: 0.5px;
  padding: 10px;
  border: 1px solid  #B0B0B0 ;
  border-radius: 5px;
  height: 100px;
  width: 100px;
  justify-content: center;
  align-items: center;   
  display: flex; 
  box-shadow: none;
  transition-duration: 0.5s;
}

.a:hover{
  box-shadow: 3px 2px 5px #E0E0E0;
  padding:calc(10px + 1%);
}
footer{
    
    position: absolute;
    background-color: #444444;
    justify-content: center;
    align-items: center;
    display: flex;
    bottom: 0%;
    width: 100%;
    height: 60px;
}
.home{
  background-color: #E0E0E0;
    justify-content: center;
    align-items: center;
    display: flex;
    border-radius: 100px;
    height: 50px;
    width: 50px;
    margin: 5px;
    transition-duration: 0.3s;

}
img{
  width: 50%;
  height: 50%;
  justify-content: center;
  align-items: center;   
  display: flex; 
}
.home:hover{
  background-color: #B0B0B0;
  width: 55px;
  height: 55px;
}
</style>
